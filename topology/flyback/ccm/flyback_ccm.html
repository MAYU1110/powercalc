<div class="container" style="padding-top: var(--spacing-xl);">
    <h1 class="section-title">电路拓扑设计</h1>
    <p class="section-subtitle">选择拓扑类型，输入设计参数，自动计算关键器件参数</p>

    <div class="topology-selector glass-card" style="padding: var(--spacing-xl); margin-bottom: var(--spacing-xl);">
        <h3 style="font-size: 1.125rem; font-weight: 600; margin-bottom: var(--spacing-md);">第一步：选择电路拓扑</h3>
        <select id="topology-select" class="form-select" style="max-width: 400px;">
            <option value="buck">Buck 降压电路</option>
            <option value="boost">Boost 升压电路</option>
            <option value="buckboost">Buck-Boost 升降压电路</option>
            <option value="flyback" selected>反激电路</option>
            <option value="llc">LLC 谐振电路</option>
        </select>
    </div>

    <div class="mode-selector glass-card" style="padding: var(--spacing-xl); margin-bottom: var(--spacing-xl);">
        <h3 style="font-size: 1.125rem; font-weight: 600; margin-bottom: var(--spacing-md);">第二步：选择工作模式</h3>
        <select id="flyback-mode-select" class="form-select" style="max-width: 400px;">
            <option value="ccm" selected>连续导通模式 (CCM)</option>
            <option value="dcm">断续导通模式 (DCM)</option>
        </select>
    </div>

    <div id="topology-content">
        <div id="schematic-section" class="schematic-container" style="display: none;">
            <h3 class="schematic-title">反激电路经典拓扑结构 (CCM模式)</h3>
            <div class="schematic-image" style="display: flex; justify-content: center; align-items: center;">
                <img id="topology-image" src="" alt="反激拓扑结构" style="max-width: 100%; height: auto; max-height: 300px; border-radius: var(--radius-md);">
            </div>
        </div>

        <div id="params-section" class="glass-card" style="padding: var(--spacing-xl); margin-bottom: var(--spacing-xl); display: none;">
            <h3 style="font-size: 1.125rem; font-weight: 600; margin-bottom: var(--spacing-lg);">第三步：输入设计参数</h3>
            <div class="grid grid-2" style="gap: var(--spacing-lg);">
                <div class="form-group">
                    <label class="form-label">最小输入电压 Vg_min <span class="form-unit">(V)</span></label>
                    <input type="number" id="param-vgmin" class="form-input" placeholder="如: 100" step="1" value="100">
                </div>
                <div class="form-group">
                    <label class="form-label">最大输入电压 Vg_max <span class="form-unit">(V)</span></label>
                    <input type="number" id="param-vgmax" class="form-input" placeholder="如: 375" step="1" value="375">
                </div>
                <div class="form-group">
                    <label class="form-label">输出电压 Vo <span class="form-unit">(V)</span></label>
                    <input type="number" id="param-vo" class="form-input" placeholder="如: 12" step="0.1" value="12">
                </div>
                <div class="form-group">
                    <label class="form-label">输出电压纹波 ΔVo <span class="form-unit">(V)</span></label>
                    <input type="number" id="param-deltavo" class="form-input" placeholder="如: 0.12" step="0.01" value="0.12">
                </div>
                <div class="form-group">
                    <label class="form-label">最大输出电流 IoL_max <span class="form-unit">(A)</span></label>
                    <input type="number" id="param-iolmax" class="form-input" placeholder="如: 2" step="0.1" value="2">
                </div>
                <div class="form-group">
                    <label class="form-label">激磁电流纹波系数 λt</label>
                    <input type="number" id="param-lambdat" class="form-input" placeholder="如: 0.4" step="0.01" value="0.4">
                </div>
                <div class="form-group">
                    <label class="form-label">满载效率 η1</label>
                    <input type="number" id="param-eta" class="form-input" placeholder="如: 0.85" step="0.01" value="0.85">
                </div>
                <div class="form-group">
                    <label class="form-label">开关频率 fs <span class="form-unit">(kHz)</span></label>
                    <input type="number" id="param-fs" class="form-input" placeholder="如: 65" step="1" value="65">
                </div>
                <div class="form-group">
                    <label class="form-label">MOS 额定电压 VDS <span class="form-unit">(V)</span></label>
                    <input type="number" id="param-vds" class="form-input" placeholder="如: 600" step="10" value="600">
                </div>
                <div class="form-group">
                    <label class="form-label">MOS 电压降额 ΔVDS <span class="form-unit">(V)</span></label>
                    <input type="number" id="param-deltavds" class="form-input" placeholder="如: 100" step="10" value="100">
                </div>
                <div class="form-group">
                    <label class="form-label">最大磁密 Bm <span class="form-unit">(Gs)</span></label>
                    <input type="number" id="param-bm" class="form-input" placeholder="如: 2000" step="100" value="2000">
                </div>
                <div class="form-group">
                    <label class="form-label">绕组电流密度 J <span class="form-unit">(A/mm²)</span></label>
                    <input type="number" id="param-j" class="form-input" placeholder="如: 4" step="0.1" value="4">
                </div>
                <div class="form-group">
                    <label class="form-label">铁芯窗口系数 K</label>
                    <input type="number" id="param-k" class="form-input" placeholder="如: 0.4" step="0.01" value="0.4">
                </div>
            </div>

            <button onclick="FlybackCCM.calculate()" class="btn btn-primary" style="width: 100%; margin-top: var(--spacing-xl); padding: var(--spacing-md) var(--spacing-xl); font-size: 1.125rem;">
                一键设计
            </button>
        </div>

        <div id="results-section" style="display: none;"></div>
    </div>
</div>
