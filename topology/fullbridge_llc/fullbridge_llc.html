<div class="container" style="padding-top: var(--spacing-xl);">
    <h1 class="section-title">电路拓扑设计</h1>
    <p class="section-subtitle">选择全桥LLC拓扑类型，输入设计参数，自动计算关键器件参数</p>

    <div class="topology-selector glass-card" style="padding: var(--spacing-xl); margin-bottom: var(--spacing-xl);">
        <h3 style="font-size: 1.125rem; font-weight: 600; margin-bottom: var(--spacing-md);">第一步：选择电路拓扑</h3>
        <select id="topology-select" class="form-select" style="max-width: 400px;">
            <option value="buck">Buck 降压电路</option>
            <option value="boost">Boost 升压电路</option>
            <option value="buckboost">Buck-Boost 升降压电路</option>
            <option value="flyback">反激电路</option>
            <option value="halfbridge_llc">半桥 LLC 谐振电路</option>
            <option value="fullbridge_llc" selected>全桥 LLC 谐振电路</option>
        </select>
    </div>

    <div id="topology-content">
        <div id="schematic-section" class="schematic-container" style="display: none;">
            <h3 class="schematic-title">全桥LLC谐振电路</h3>
            <div class="schematic-image" style="display: flex; justify-content: center; align-items: center;">
                <img id="topology-image" src="" alt="全桥LLC拓扑结构" style="max-width: 100%; height: auto; max-height: 300px; border-radius: var(--radius-md);">
            </div>
        </div>

        <div id="params-section" class="glass-card" style="padding: var(--spacing-xl); margin-bottom: var(--spacing-xl); display: none;">
            <h3 style="font-size: 1.125rem; font-weight: 600; margin-bottom: var(--spacing-lg);">第三步：输入设计参数</h3>
            <div class="grid grid-2" style="gap: var(--spacing-lg);">
                <div class="form-group">
                    <label class="form-label">输入电压 Vin <span class="form-unit">(V)</span></label>
                    <input type="number" id="param-vin" class="form-input" placeholder="如: 400" step="0.1" value="400">
                </div>
                <div class="form-group">
                    <label class="form-label">输出电压 Vout <span class="form-unit">(V)</span></label>
                    <input type="number" id="param-vout" class="form-input" placeholder="如: 12" step="0.1" value="12">
                </div>
                <div class="form-group">
                    <label class="form-label">输出功率 Po <span class="form-unit">(W)</span></label>
                    <input type="number" id="param-po" class="form-input" placeholder="如: 600" step="1" value="600">
                </div>
                <div class="form-group">
                    <label class="form-label">开关频率 fs <span class="form-unit">(kHz)</span></label>
                    <input type="number" id="param-fs" class="form-input" placeholder="如: 100" step="1" value="100">
                </div>
                <div class="form-group">
                    <label class="form-label">谐振频率 fr <span class="form-unit">(kHz)</span></label>
                    <input type="number" id="param-fr" class="form-input" placeholder="如: 100" step="1" value="100">
                </div>
                <div class="form-group">
                    <label class="form-label">电压纹波系数 Ku</label>
                    <input type="number" id="param-ku" class="form-input" placeholder="如: 0.01" step="0.001" value="0.01">
                    <small style="color: var(--text-muted); margin-top: var(--spacing-xs); display: block;">典型值0.005~0.02</small>
                </div>
                <div class="form-group">
                    <label class="form-label">效率 η</label>
                    <input type="number" id="param-eta" class="form-input" placeholder="如: 0.96" step="0.01" value="0.96">
                    <small style="color: var(--text-muted); margin-top: var(--spacing-xs); display: block;">典型值0.92~0.98</small>
                </div>
            </div>

            <button onclick="FullbridgeLLC.calculate()" class="btn btn-primary" style="width: 100%; margin-top: var(--spacing-xl); padding: var(--spacing-md) var(--spacing-xl); font-size: 1.125rem;">
                一键设计
            </button>
        </div>

        <div id="results-section" style="display: none;">
        </div>
    </div>
</div>
